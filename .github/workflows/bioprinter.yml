name: Bioprinter offline core
on:
  push:
    paths: ['bioprinter/**', '.github/workflows/bioprinter.yml']
  pull_request:
    paths: ['bioprinter/**', '.github/workflows/bioprinter.yml']
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bioprinter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=validation/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bioprinter-${{ matrix.os }}
          path: bioprinter/validation/
