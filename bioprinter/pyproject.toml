[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioprinter-pipeline"
version = "0.1.0"
description = "Offline image-to-syringe planning with explicit Duet controls"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6", "Pillow==11.3.0", "opencv-python-headless==4.12.0.88",
  "shapely==2.1.2", "svgpathtools==1.7.1", "defusedxml==0.7.1",
  "pydantic==2.11.7", "PyYAML==6.0.2", "httpx==0.28.1",
  "matplotlib==3.10.5", "plotly==6.3.0", "jsonschema==4.25.1"
]
[project.scripts]
bioprinter = "bioprinter.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["external: optional installed executable", "notebook: fresh kernel offline execution"]
